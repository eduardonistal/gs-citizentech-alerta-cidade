name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Scan secrets (Gitleaks) — árvore atual
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --no-git --exit-code 1 -v
      - name: Scan source (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:1.97.0 \
            semgrep --config=p/ci --error --quiet /src/MVP /src/06-Secure-DevOps-Tools-Cloud-Computing
      - name: Scan Terraform (Trivy)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.0 \
            config --exit-code 1 --severity HIGH,CRITICAL \
            /repo/06-Secure-DevOps-Tools-Cloud-Computing/terraform
      - name: Validate Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o /tmp/tf.zip
          sudo unzip -o /tmp/tf.zip -d /usr/local/bin
          terraform -chdir=06-Secure-DevOps-Tools-Cloud-Computing/terraform fmt -check -recursive
          terraform -chdir=06-Secure-DevOps-Tools-Cloud-Computing/terraform init -backend=false
          terraform -chdir=06-Secure-DevOps-Tools-Cloud-Computing/terraform validate

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 06-Secure-DevOps-Tools-Cloud-Computing/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.name }}
      - name: Scan published image (Trivy)
        if: github.event_name == 'push'
        run: |
          docker run --rm aquasec/trivy:0.58.0 image \
            --exit-code 1 --severity HIGH,CRITICAL \
            "${{ steps.image.outputs.name }}"

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Public health evidence (teto R$ 0)
        run: |
          echo "Deploy cloud pago desabilitado (teto R$ 0)."
          echo "MVP público via Cloudflare Tunnel documentado no README."
          echo "CI security+build são a evidência de pipeline barrando/aprovando."
