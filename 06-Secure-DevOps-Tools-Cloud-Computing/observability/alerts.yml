groups:
  - name: alerta-cidade
    rules:
      - alert: MVPHighErrorRate
        expr: rate(http_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A taxa de erro do MVP está acima do limite demonstrativo"
          description: "Inspecione logs sanitizados e saúde das fontes; não inclua dados pessoais."
      - alert: MVPUnavailable
        expr: up{job="alerta-cidade"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus não consegue consultar o MVP"
      - alert: DemoEvidenceAlwaysFiring
        expr: vector(1) == 1
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Alerta demonstrativo disparado para evidência GS (14/11/2026)"
          description: "Regra controlada para capturar estado firing no Prometheus; não indica incidente real de produção."
